name: Import original GLB models
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-glb.yml'
permissions:
  contents: write
jobs:
  import-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download eight generated GLB models
        run: |
          set -euo pipefail
          mkdir -p characters
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-01.glb" 'https://pikaso.cdnpk.net/private/production/6085799746/model.glb?token=exp=1795219200~hmac=2b7946a67db3d74b00fe0c10cf1134e183442663b6c03bdf7aa36e332c975704'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-02.glb" 'https://pikaso.cdnpk.net/private/production/6085865787/model.glb?token=exp=1795219200~hmac=08ab103c45bfb95f7200a2661fef3f2648bf862e9fbe0ae9b57c84748f90f524'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-03.glb" 'https://pikaso.cdnpk.net/private/production/6085906616/model.glb?token=exp=1795219200~hmac=5976659cd9a3fb7a4a831d907a43b018fd1bf7854a3a8f4a867fb8ca87d178bf'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-05.glb" 'https://pikaso.cdnpk.net/private/production/6085865705/model.glb?token=exp=1795219200~hmac=28e52bd6df7937c4623530872d6428f61ef9070c4dd7cde05fe42f248ff2d24f'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-08.glb" 'https://pikaso.cdnpk.net/private/production/6085865582/model.glb?token=exp=1795219200~hmac=a370439dc96ed40083ba9bc9ee3e398fa7eafcfd2af5009b0b6a2840e94ff925'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-11.glb" 'https://pikaso.cdnpk.net/private/production/6085905139/model.glb?token=exp=1795219200~hmac=d047cb5ef0f289f6cc50889415e64c6b2c6a997351facb31d2c1391a34764e78'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-15.glb" 'https://pikaso.cdnpk.net/private/production/6085904639/model.glb?token=exp=1795219200~hmac=7d368f3c2e601e5c8e8826cae8b99932b68454bc182060e4103323178608354d'
          curl --fail --location --retry 3 --max-time 240 --output "characters/employee-17.glb" 'https://pikaso.cdnpk.net/private/production/6085913445/model.glb?token=exp=1795219200~hmac=5f6c37219f5b15a6fea7de579588dfe634768f518d2911557192a82a9fd4b187'
          file characters/*.glb
          du -h characters/*.glb
      - name: Commit permanent GLB files to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/*.glb
          git commit -m 'Store eight original GLB models locally' || exit 0
          git push
